{% load static %}
<!doctype html><html lang="en" data-theme="{{ site_theme|default:'light' }}" data-font-size="{{ site_font_size|default:'medium' }}" data-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}"><head>
  <script src="{% static 'js/theme-init.js' %}"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Articles | Fan Hub Plus</title>{% include "_head_assets.html" %}
</head><body>{% include "_session_controls.html" %}<main class="page-content"><h1>Articles</h1><p><a href="{% url 'home' %}">Home</a> / Articles</p>{% for article in articles %}<article><h2><a href="{% url 'article-detail' article.slug %}">{{ article.title }}</a></h2><p>{{ article.description }}</p></article>{% empty %}<p>No published articles yet.</p>{% endfor %}</main><footer><a href="{% url 'sitemap' %}">Sitemap</a></footer></body></html>
