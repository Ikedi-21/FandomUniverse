{% load static %}<html><head><title>Media Centre</title><link rel="stylesheet" href="{% static 'css/base.css' %}"></head><body><main class="page-content"><h1>Media Centre</h1>{% for item in items %}<article><h2><a href="{% url 'content-detail' item.slug %}">{{ item.title }}</a></h2><p>{{ item.description }}</p>{% if item.video_url %}<a href="{{ item.video_url }}">Watch or listen</a>{% endif %}</article>{% empty %}<p>No published video or audio items yet.</p>{% endfor %}</main><footer><a href="{% url 'sitemap' %}">Sitemap</a></footer></body></html>
