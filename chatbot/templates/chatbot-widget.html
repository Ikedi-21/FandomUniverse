<!-- ====================================================================

{% load static %}
     FAN HUB+ STANDALONE CHATBOT WIDGET SNIPPET
     Can be dropped directly into any Django template or static HTML page.
     Requires:
       - css/tokens.css, css/base.css, css/chatbot.css
       - js/chatbot.js (with defer) (with defer)
     ==================================================================== -->

<!-- 1. CHATBOT LAUNCHER BUTTON -->
<button id="chatbotLauncher" class="chatbot-launcher" aria-label="Open Fan Hub Assistant" aria-expanded="false" aria-controls="chatbotPanel">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chatbot-launcher-icon"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chatbot-launcher-close"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  <span class="chatbot-badge" id="chatbotBadge" style="display:none;">1</span>
</button>

<!-- 2. EXPANDABLE CHATBOT ASIDE PANEL -->
<aside id="chatbotPanel" class="chatbot-panel" aria-hidden="true" role="dialog" aria-label="Fan Hub+ Assistant">
  <div class="chatbot-header">
    <div class="chatbot-header-info">
      <div class="chatbot-avatar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
      </div>
      <div>
        <div class="chatbot-title">FanBot Assistant</div>
        <div class="chatbot-status"><span class="chatbot-status-dot"></span> Online &bull; Fandom AI</div>
      </div>
    </div>
    <div class="chatbot-header-actions">
      <button type="button" class="chatbot-control-btn" id="chatbotClearBtn" title="Clear chat history" aria-label="Clear chat">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
      <button type="button" class="chatbot-control-btn" id="chatbotCloseBtn" title="Close assistant" aria-label="Close assistant">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <!-- Message history container (populated dynamically by chatbot.js) -->
  <div class="chatbot-messages" id="chatbotMessages" role="log" aria-live="polite">
    <!-- LOOP: initial messages or persisted fanhub_chat_history -->
  </div>

  <!-- Quick suggestion chips (populated dynamically by chatbot.js based on current page/category) -->
  <div class="chatbot-quick-chips" id="chatbotQuickChips" aria-label="Suggested questions">
    <!-- LOOP: quick chips -->
  </div>

  <!-- Chatbot input form -->
  <form class="chatbot-input-row" id="chatbotForm" method="post" action="{% url 'chatbot:ask' %}" data-endpoint="{% url 'chatbot:ask' %}">
    {% csrf_token %}
    <input type="text" id="chatbotInput" name="message" class="chatbot-input" placeholder="Ask about this site..." autocomplete="off" aria-label="Type your message" />
    <button type="submit" id="chatbotSendBtn" class="chatbot-send-btn" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
</aside>
