{% load static %}
<header class="top-header" id="topHeader">
  <div class="header-left"><button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation">☰</button>
    <a href="{% url 'home' %}" class="brand-title">FAN HUB<span>+</span></a></div>
  <nav class="header-actions" aria-label="Primary navigation">
    <a href="{% url 'home' %}">Home</a><a href="{% url 'explore' %}">Explore</a>
    {% if request.user.is_authenticated %}
      {% if request.user.is_staff %}
        <div class="admin-nav" style="display: inline-flex; align-items: center; gap: 10px; margin-right: 15px; background: rgba(239, 35, 60, 0.1); padding: 5px 10px; border-radius: 8px;">
          <a href="{% url 'admin_overview' %}" style="color: var(--primary); font-weight: bold;">ADMIN PORTAL</a>
          <a href="{% url 'admin_overview' %}" style="font-size: 0.85em;">Overview</a>
          <a href="{% url 'admin_content_form' %}" style="font-size: 0.85em;">Content</a>
          <a href="{% url 'admin_submissions' %}" style="font-size: 0.85em;">Submissions</a>
          <a href="{% url 'admin_chatbot_faq' %}" style="font-size: 0.85em;">Chatbot FAQ</a>
        </div>
      {% endif %}
      <span>Signed in as {{ request.user.username }}</span>
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Log Out</button></form>
    {% else %}<a href="{% url 'accounts:login' %}">Log in</a><a href="{% url 'accounts:register' %}">Register</a>{% endif %}
  </nav>
</header>
